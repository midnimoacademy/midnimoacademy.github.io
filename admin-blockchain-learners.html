<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Blockchain learners | Midnimo Academy</title><style>body{margin:0;background:#f4f7fb;color:#172944;font:16px/1.6 system-ui}header{background:#071936;color:white;padding:24px}header a{color:#e6bd57}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce4ed;border-radius:12px;padding:20px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce4ed}button{padding:10px 16px;background:#e6bd57;border:0;border-radius:7px;font:inherit;margin:12px 8px 0 0}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><div class="wrap"><a href="/admin-hub.html">← Administration centre</a><h1>Blockchain learner registrations</h1></div></header><main class="wrap"><p id="status" role="status">Checking administrator access…</p><section id="private" class="card" hidden><p id="count"></p><p>These are completed Blockchain learner forms. Registration does not by itself confirm lesson attendance or completion.</p><div class="scroll"><table><thead><tr><th>Name</th><th>Gender</th><th>Age</th><th>City / town</th><th>Country</th><th>Registered</th></tr></thead><tbody id="rows"></tbody></table></div><button id="previous">Previous</button><button id="next">Next</button><span id="page"></span></section></main><script>
const db=window.supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff'),$=id=>document.getElementById(id);let page=0;
async function render(){const r=await db.from('blockchain_learner_profiles').select('full_name,gender,gender_description,age,city,country,created_at',{count:'exact'}).order('created_at',{ascending:false}).range(page*50,page*50+49);if(r.error)throw r.error;$('count').textContent=r.count+' completed learner form(s)';$('rows').replaceChildren();for(const profile of r.data){const tr=document.createElement('tr');for(const value of [profile.full_name,profile.gender==='Self-described'?profile.gender_description:profile.gender,profile.age,profile.city,profile.country,new Date(profile.created_at).toLocaleDateString('en-GB')]){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}$('rows').append(tr)}$('previous').disabled=page===0;$('next').disabled=(page+1)*50>=r.count;$('page').textContent='Page '+(page+1);$('status').textContent='Administrator access confirmed. Learner details are private.'}
async function move(change){page+=change;try{await render()}catch{$('status').textContent='Could not load records. Please refresh.'}}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
(async()=>{try{const {data:{user}}=await db.auth.getUser();if(!user){$('status').innerHTML='Please <a href="/student.html?next=admin">sign in as administrator</a>.';return}const r=await db.from('academy_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(r.error||!r.data)throw Error('Administrator access required.');$('private').hidden=false;await render()}catch(e){$('status').textContent=e.message}})();
</script></body></html>
