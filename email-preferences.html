<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Email preferences | Midnimo Academy</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f4f7fb;color:#14243d;margin:0}header{background:#071936;color:white;padding:25px}header a{color:#e6bd57}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:white;padding:28px;border-radius:16px;border:1px solid #dce4ef}.row{display:flex;gap:14px;align-items:flex-start;margin:22px 0}input{width:22px;height:22px;accent-color:#0b315b}button{background:#e6bd57;border:0;border-radius:9px;padding:12px 23px;font-weight:800;cursor:pointer}.muted{color:#53647b}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><div class="wrap"><a href="/dashboard.html">← Student dashboard</a><h1>Newsletter & email preferences</h1></div></header><main class="wrap"><div class="card"><p>Choose which optional Midnimo Academy emails you want. You can change your choices at any time.</p><div id="auth">Checking account…</div><form id="form" hidden><label class="row"><input id="academy_updates" type="checkbox"><span><strong>Academy newsletter</strong><br>New courses, website improvements, Blockchain Hub updates and upcoming opportunities.</span></label><label class="row"><input id="progress_emails" type="checkbox"><span><strong>Personal learning progress</strong><br>Private summaries of your completed lessons and next learning steps, when available.</span></label><button type="submit">Save preferences</button></form><p id="status" role="status"></p><p class="muted">Both options are off until you opt in. Uncheck either option and save to stop that type of optional email.</p></div></main><script>const db=window.supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff');let uid;async function init(){const {data:{user}}=await db.auth.getUser();if(!user){document.getElementById('auth').innerHTML='Please <a href="/student.html">sign in</a> to manage email preferences.';return}uid=user.id;document.getElementById('auth').textContent='Signed in as '+user.email;const {data,error}=await db.from('newsletter_preferences').select('academy_updates,progress_emails').eq('user_id',uid).maybeSingle();if(error){document.getElementById('status').textContent=error.message;return}if(data){document.getElementById('academy_updates').checked=data.academy_updates;document.getElementById('progress_emails').checked=data.progress_emails}document.getElementById('form').hidden=false}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('newsletter_preferences').upsert({user_id:uid,academy_updates:document.getElementById('academy_updates').checked,progress_emails:document.getElementById('progress_emails').checked,updated_at:new Date().toISOString()});document.getElementById('status').textContent=error?'Could not save: '+error.message:'Preferences saved successfully.'};init();</script></body></html>
