<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create New Password | Midnimo Academy</title><style>body{margin:0;background:#f3f6fb;color:#172a45;font:16px system-ui}header{background:#071936;color:white;padding:24px}header a{color:#e6bd57}main{max-width:520px;margin:55px auto;padding:20px}.card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 40px #07193614}label{display:block;margin:18px 0}input{display:block;width:100%;box-sizing:border-box;padding:14px;margin-top:7px;border:1px solid #abb7c8;border-radius:8px;font:inherit}button{background:#e6bd57;border:0;border-radius:8px;padding:13px 20px;font-weight:750;cursor:pointer}button:disabled{opacity:.5}#status{line-height:1.6}a{color:#174b85}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><h2>Midnimo Academy</h2><a href="/">Home</a></header><main><div class="card"><h1>Create a new password</h1><p id="status" role="status">Checking your password reset link…</p><form id="resetForm" hidden><label>New password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button id="save" type="submit">Save new password</button></form><p><a href="/student.html">Return to sign in</a></p></div></main><script>
const db=supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff');const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));let verified=false;const say=s=>$('status').textContent=s;function ready(){verified=true;$('resetForm').hidden=false;say('Your reset link is valid. Choose a new password of at least 8 characters.')}
async function check(){if(params.get('error')||hash.get('error')){say('Reset link error: '+(params.get('error_description')||hash.get('error_description')||'Expired or invalid link')+'. Request a new link from the sign-in page.');return}try{if(params.get('token_hash')&&params.get('type')==='recovery'){const r=await db.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});if(r.error)throw r.error;history.replaceState({},'',location.pathname);ready();return}if(params.get('code')){const r=await db.auth.exchangeCodeForSession(params.get('code'));if(r.error)throw r.error;history.replaceState({},'',location.pathname);ready();return}if(hash.get('access_token')&&hash.get('refresh_token')){const r=await db.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(r.error)throw r.error;history.replaceState({},'',location.pathname);ready();return}if(hash.get('type')==='recovery'){const r=await db.auth.getSession();if(r.data.session){history.replaceState({},'',location.pathname);ready();return}}say('This page needs a valid password reset link. Open the latest link from your email, or request a new one on the sign-in page.')}catch(e){say('Could not verify your reset link: '+e.message+'. Request a new link.')}}check();
$('resetForm').onsubmit=async e=>{e.preventDefault();if(!verified)return;const p=$('password').value;if(p!==$('confirm').value){say('Passwords do not match.');return}if(p.length<8){say('Use at least 8 characters.');return}const b=$('save');b.disabled=true;say('Saving your new password…');const r=await db.auth.updateUser({password:p});if(r.error){say(r.error.message);b.disabled=false;return}$('resetForm').hidden=true;say('Password changed successfully. You can now sign in using your new password.');await db.auth.signOut();};
</script></body></html>
