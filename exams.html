<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Examination Centre | Midnimo Academy</title><style>body{margin:0;background:#f4f7fb;color:#142744;font:16px system-ui}header{background:#071936;color:white;padding:22px}header a{color:#e6bd57}main{max-width:900px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:22px;margin:18px 0}button{background:#e6bd57;color:#071936;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}textarea{width:100%;min-height:120px;padding:12px;box-sizing:border-box}small{color:#59677b}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><h1>Midnimo Academy · Examination Centre</h1><a href="/dashboard.html">Student dashboard</a> · <a href="/exam-admin.html">Exam administration</a></header><main><h2>Final examinations</h2><p>Three subjects: Fundamental Analysis, Technical Analysis, and Market Sentiment & Psychology. Minimum 50% in each. Failed subjects allow three retakes. Passing subjects stay passed.</p><p id="status">Loading…</p><div id="exams"></div></main><script>
const db=supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff');const $=id=>document.getElementById(id);function elem(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
async function load(){const {data:{user}}=await db.auth.getUser();if(!user){$('status').textContent='Sign in first using Student access.';const a=elem('a','Sign in →',$('status'));a.href='/student.html';return}const [er,ar]=await Promise.all([db.from('academy_exams').select('id,subject,title,cohort_name,max_points,instructions,due_at').eq('is_published',true).order('id'),db.from('exam_attempts').select('id,exam_id,attempt_number,awarded_points,approved_at,submitted_at').eq('user_id',user.id).order('attempt_number')]);if(er.error||ar.error){$('status').textContent=er.error?.message||ar.error?.message;return}$('status').textContent=er.data.length?'Available exams':'No exams published yet.';for(const exam of er.data){const box=elem('section','',$('exams'));box.className='card';elem('h3',exam.title,box);elem('p',exam.cohort_name+' · '+exam.subject+' · Maximum '+exam.max_points+' points · Pass at '+Number(exam.max_points)/2,box);elem('p',exam.instructions||'Read the instructions and submit your written response.',box);if(exam.due_at)elem('p','Deadline: '+new Date(exam.due_at).toLocaleString('en-GB'),box);const attempts=ar.data.filter(x=>x.exam_id===exam.id),passed=attempts.some(x=>x.approved_at&&Number(x.awarded_points)>=Number(exam.max_points)/2);for(const a of attempts)elem('p','Attempt '+a.attempt_number+': '+(a.approved_at?Number(a.awarded_points)+'/'+exam.max_points+(Number(a.awarded_points)>=Number(exam.max_points)/2?' — PASS':' — FAIL'):'Awaiting administrator-approved result'),box);if(passed){elem('strong','Subject passed. No retake required.',box);continue}if(attempts.length>=4){elem('strong','Four attempts used. Contact the academy for review.',box);continue}if(attempts.length&&attempts.some(x=>!x.approved_at)){elem('p','Wait for your current attempt to be graded and approved.',box);continue}if(exam.due_at&&new Date(exam.due_at)<new Date()){elem('p','Submission deadline has passed.',box);continue}const form=elem('form','',box),notes=elem('textarea','',form);notes.placeholder='Write your exam answers or explain your chart analysis. Include a private reference to screenshots submitted to your teacher.';notes.required=true;notes.minLength=20;notes.maxLength=10000;const fileLabel=elem('label','Chart screenshots (optional, maximum 3 images, 10 MB each)',form);const evidence=elem('input','',fileLabel);evidence.type='file';evidence.accept='image/png,image/jpeg,image/webp';evidence.multiple=true;const btn=elem('button',attempts.length?'Submit retake':'Submit exam',form);form.onsubmit=async ev=>{ev.preventDefault();if(!confirm('Submit this attempt for assessment?'))return;btn.disabled=true;const selected=Array.from(evidence.files);if(selected.length>3||selected.some(f=>f.size>10485760||!['image/png','image/jpeg','image/webp'].includes(f.type))){alert('Choose up to three PNG, JPEG or WebP images, each no larger than 10 MB.');btn.disabled=false;return}const z=await db.from('exam_attempts').insert({exam_id:exam.id,user_id:user.id,practical_notes:notes.value.trim()}).select('id').single();if(!z.error){let failed=[];for(const file of selected){const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=user.id+'/'+z.data.id+'/'+crypto.randomUUID()+'.'+ext;const upload=await db.storage.from('exam-evidence').upload(path,file,{contentType:file.type,upsert:false});if(upload.error){failed.push(file.name+': '+upload.error.message);continue}const ref=await db.from('exam_uploads').insert({attempt_id:z.data.id,user_id:user.id,storage_path:path});if(ref.error)failed.push(file.name+': '+ref.error.message)}if(failed.length)alert('Exam submitted, but some images failed: '+failed.join('; '))}if(z.error){alert(z.error.message);btn.disabled=false}else location.reload()}}}load();</script></body></html>
