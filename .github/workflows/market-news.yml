name: Update Midnimo Market News
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: midnimo-market-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect headlines
        run: python scripts/update_market_news.py
      - name: Publish updated data
        run: |
          if ! git diff --quiet -- data/market-news.json; then
            git config user.name "midnimo-news-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market-news.json
            git commit -m "Refresh public market headlines"
            git push
          fi
