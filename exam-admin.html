<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Administration | Midnimo Academy</title><style>body{margin:0;background:#f4f7fb;color:#142744;font:16px system-ui}header{background:#071936;color:white;padding:22px}header a{color:#e6bd57}main{max-width:1050px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:22px;margin:18px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:6px 0 15px;border:1px solid #a9bad0;border-radius:6px}textarea{min-height:100px}button{background:#e6bd57;color:#071936;border:0;border-radius:8px;padding:11px 16px;margin:5px;cursor:pointer}label{font-weight:600}small{color:#61718a}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><h1>Midnimo Academy · Exam Administration</h1><a href="/admin-classes.html">Class administration</a> · <a href="/exams.html">Student exam centre</a></header><main><p id="status">Checking administrator access…</p><div id="panel" hidden><section class="card"><h2>Create examination</h2><form id="create"><label>Cohort name<input id="cohort" required placeholder="Cohort 1"></label><label>Subject<select id="subject"><option value="fundamental">Fundamental Analysis</option><option value="technical">Technical Analysis</option><option value="psychology">Market Sentiment & Psychology</option></select></label><label>Exam title<input id="title" required></label><label>Maximum available points<input id="max" type="number" min="1" step="0.5" required></label><label>Instructions<textarea id="instructions" required placeholder="Describe questions and how students should submit their work"></textarea></label><label>Deadline (optional)<input id="due" type="datetime-local"></label><label><input id="publish" type="checkbox" style="width:auto;display:inline"> Publish immediately</label><button>Create exam</button></form></section><section class="card"><h2>Exams & marking</h2><div id="list"></div></section></div></main><script>
const db=supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff');const $=id=>document.getElementById(id);const add=(parent,tag,text)=>{const x=document.createElement(tag);x.textContent=text;parent.append(x);return x};function say(s){$('status').textContent=s}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){say('Sign in using Student access before opening this page.');return}const a=await db.from('academy_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!a.data){say('This account does not have administrator permission.');return}$('panel').hidden=false;say('Administrator access confirmed.');refresh()}
$('create').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;const z=await db.from('academy_exams').insert({cohort_name:$('cohort').value.trim(),subject:$('subject').value,title:$('title').value.trim(),max_points:Number($('max').value),instructions:$('instructions').value.trim(),due_at:$('due').value?new Date($('due').value).toISOString():null,is_published:$('publish').checked});say(z.error?z.error.message:'Exam created.');if(!z.error){$('create').reset();refresh()}btn.disabled=false};
async function refresh(){const z=await db.from('academy_exams').select('id,title,subject,cohort_name,max_points,is_published').order('id',{ascending:false});if(z.error){say(z.error.message);return}$('list').replaceChildren();for(const e of z.data){const box=add($('list'),'section','');box.className='card';add(box,'h3',e.title);add(box,'p',e.cohort_name+' · '+e.subject+' · '+e.max_points+' points · '+(e.is_published?'Published':'Draft'));const pub=add(box,'button',e.is_published?'Unpublish':'Publish');pub.onclick=async()=>{const x=await db.from('academy_exams').update({is_published:!e.is_published}).eq('id',e.id);say(x.error?x.error.message:'Exam updated');if(!x.error)refresh()};const review=add(box,'button','Review submissions');review.onclick=()=>submissions(e);}}
async function submissions(e){const z=await db.from('exam_attempts').select('id,user_id,attempt_number,practical_notes,awarded_points,feedback,approved_at,submitted_at').eq('exam_id',e.id).order('submitted_at',{ascending:false});if(z.error){say(z.error.message);return}const host=$('list');host.replaceChildren();const back=add(host,'button','← All exams');back.onclick=refresh;add(host,'h2','Submissions — '+e.title);if(!z.data.length)add(host,'p','No submissions yet.');for(const a of z.data){const box=add(host,'section','');box.className='card';add(box,'p','Student: '+a.user_id+' · Attempt '+a.attempt_number+' · '+new Date(a.submitted_at).toLocaleString('en-GB'),box);add(box,'h4','Student response');add(box,'p',a.practical_notes||'(No response)');add(box,'p',a.approved_at?'Approved result: '+a.awarded_points+'/'+e.max_points:'Awaiting approved result');const label=add(box,'label','Points awarded');const points=add(label,'input','');points.type='number';points.min=0;points.max=e.max_points;points.step=0.5;points.value=a.awarded_points??'';const feedbackLabel=add(box,'label','Teacher feedback');const feedback=add(feedbackLabel,'textarea','');feedback.value=a.feedback||'';const btn=add(box,'button','Approve result');btn.disabled=!!a.approved_at;btn.onclick=async()=>{const score=Number(points.value);if(!points.value||!Number.isFinite(score)||score<0||score>Number(e.max_points)){alert('Enter points between 0 and '+e.max_points);return}if(!confirm('Approve and release this result to the student?'))return;btn.disabled=true;const x=await db.from('exam_attempts').update({awarded_points:score,manual_points:score,feedback:feedback.value,graded_at:new Date().toISOString(),approved_at:new Date().toISOString()}).eq('id',a.id);say(x.error?x.error.message:'Result approved and released.');if(x.error)btn.disabled=false;else submissions(e)}}}
init();</script></body></html>
