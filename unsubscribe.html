<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Unsubscribe | Midnimo Academy</title><style>body{font:17px/1.6 system-ui;background:#f4f7fb;color:#14243d;margin:0;padding:24px}main{max-width:620px;margin:50px auto;background:white;padding:28px;border-radius:16px}button{font:inherit;background:#e6bd57;border:0;padding:12px 20px;border-radius:8px}</style></head><body><main><h1>Midnimo Academy</h1><p>Stop optional academy newsletters and personal progress emails.</p><button id="unsubscribe">Unsubscribe</button><p id="status" role="status"></p><p><a href="/email-preferences.html">Manage individual email preferences</a></p></main><script>
const token=location.hash.slice(1),button=document.getElementById('unsubscribe'),status=document.getElementById('status');history.replaceState(null,'',location.pathname);
if(!/^[a-f0-9-]{72}$/.test(token)){button.disabled=true;status.textContent='This link is invalid. Please use email preferences.'}
button.onclick=async()=>{button.disabled=true;status.textContent='Saving…';try{const response=await fetch('https://uecogftwdvpfhxkdgjel.supabase.co/functions/v1/newsletter-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),signal:AbortSignal.timeout(20000)});const result=await response.json();if(!response.ok)throw Error(result.error);status.textContent=result.message}catch(e){status.textContent=e.message||'Unable to unsubscribe. Please try again.';button.disabled=false}};
</script></body></html>
