<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal Analytics | Midnimo Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><style>body{margin:0;font:16px/1.5 system-ui;background:#f5f7fb;color:#15243b}header{background:#071936;color:white;padding:22px}main{max-width:1100px;margin:auto;padding:28px 18px}h1{margin:0}a{color:#e6bd57}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:white;padding:24px;border:1px solid #dce4ed;border-radius:12px}.card strong{display:block;font-size:2rem;color:#071936}.card span{color:#52647b}button{background:#e6bd57;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;font-weight:bold}.note{color:#52647b}</style></head><body><header><a href="/admin.html">← Admin Dashboard</a><h1>Trading Journal Analytics</h1></header><main><p id="status" role="status">Checking administrator access…</p><div class="grid" id="metrics" hidden></div><p class="note">Counts represent signed-in users only. Guest browser activity is not tracked. Visits are recorded once per user per UTC day. Cloud trade totals exclude browser-only trades. No individual trading records are shown.</p><button id="refresh" hidden>Refresh statistics</button></main><script>const db=window.supabase.createClient("https://uecogftwdvpfhxkdgjel.supabase.co","sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff");const labels={total_users:"Unique journal users",today:"Active today",last_7_days:"Active last 7 days",last_30_days:"Active last 30 days",returning_users:"Returning users (2+ days)",cloud_trades:"Cloud trades recorded",cloud_traders:"Users with cloud trades"};async function load(){const status=document.getElementById("status");const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){status.textContent="Please sign in as an administrator to view analytics.";return}const {data,error}=await db.rpc("journal_admin_metrics");if(error){status.textContent="Unable to load administrator statistics: "+error.message;return}document.getElementById("metrics").innerHTML=Object.entries(labels).map(([key,label])=>'<div class="card"><span>'+label+'</span><strong>'+Number(data[key]||0).toLocaleString("en-GB")+'</strong></div>').join("");document.getElementById("metrics").hidden=false;document.getElementById("refresh").hidden=false;status.textContent="Updated "+new Date().toLocaleString("en-GB")};document.getElementById("refresh").onclick=load;load();</script></body></html>
