<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Marking | Midnimo Academy</title><style>body{margin:0;background:#f4f7fb;color:#142744;font:16px system-ui}header{background:#071936;color:#fff;padding:22px}header a{color:#e6bd57}main{max-width:980px;margin:auto;padding:20px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:20px;margin:18px 0}button{background:#e6bd57;border:0;border-radius:8px;padding:11px;margin:5px;cursor:pointer}input,textarea,select{padding:10px;max-width:100%;box-sizing:border-box}textarea{display:block;width:100%;min-height:100px}img{max-width:100%;max-height:550px;display:block;margin:12px 0}a{color:#174b83}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><h1>Midnimo Academy · Teacher Marking</h1><a href="/exams.html">Examination Centre</a> · <a href="/exam-admin.html">Administrator results</a></header><main><p id="status">Checking teacher access…</p><div id="panel" hidden><label>Choose examination <select id="exam"></select></label><button id="review">Load submissions</button><div id="submissions"></div></div></main><script>
const db=supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff');const $=id=>document.getElementById(id);function add(p,t,s){const n=document.createElement(t);n.textContent=s;p.append(n);return n}function msg(s){$('status').textContent=s}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){msg('Please sign in first.');return}const [t,a]=await Promise.all([db.from('academy_teachers').select('user_id').eq('user_id',user.id).maybeSingle(),db.from('academy_admins').select('user_id').eq('user_id',user.id).maybeSingle()]);if(!t.data&&!a.data){msg('Teacher or administrator access required.');return}const z=await db.from('academy_exams').select('id,title,max_points').order('id',{ascending:false});if(z.error){msg(z.error.message);return}window.exams=z.data;$('panel').hidden=false;for(const e of z.data){const o=add($('exam'),'option',e.title);o.value=e.id}$('review').onclick=review;msg('Select an examination to review.')}
async function review(){const exam=exams.find(x=>String(x.id)===$('exam').value);if(!exam)return;const z=await db.from('exam_attempts').select('id,user_id,attempt_number,practical_notes,awarded_points,feedback,approved_at,submitted_at').eq('exam_id',exam.id).order('submitted_at',{ascending:false});if(z.error){msg(z.error.message);return}const host=$('submissions');host.replaceChildren();if(!z.data.length)add(host,'p','No submissions yet.');for(const a of z.data){const card=add(host,'section','');card.className='card';add(card,'h3','Attempt '+a.attempt_number+' · Student '+a.user_id);add(card,'p',new Date(a.submitted_at).toLocaleString('en-GB'));add(card,'p',a.practical_notes||'(No written explanation)');const images=await db.from('exam_uploads').select('storage_path').eq('attempt_id',a.id);if(images.error)add(card,'p','Images unavailable: '+images.error.message);else for(const x of images.data){const signed=await db.storage.from('exam-evidence').createSignedUrl(x.storage_path,300);if(signed.error){add(card,'p','Could not load image');continue}const img=add(card,'img','');img.src=signed.data.signedUrl;img.alt='Student chart evidence';img.loading='lazy'}if(a.approved_at){add(card,'p','Approved: '+a.awarded_points+'/'+exam.max_points);continue}const label=add(card,'label','Points (0–'+exam.max_points+')');const score=add(label,'input','');score.type='number';score.min='0';score.max=String(exam.max_points);score.step='0.5';score.value=a.awarded_points??'';const feedbackLabel=add(card,'label','Feedback');const feedback=add(feedbackLabel,'textarea','');feedback.value=a.feedback||'';const b=add(card,'button','Save teacher marks (administrator approves)');b.onclick=async()=>{const val=Number(score.value);if(!score.value||!Number.isFinite(val)||val<0||val>Number(exam.max_points)){alert('Enter valid points');return}b.disabled=true;const u=await db.from('exam_attempts').update({awarded_points:val,manual_points:val,feedback:feedback.value,graded_at:new Date().toISOString()}).eq('id',a.id);msg(u.error?u.error.message:'Marks saved for administrator approval.');b.disabled=false}}}
init();</script></body></html>
