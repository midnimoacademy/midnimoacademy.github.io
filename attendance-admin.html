<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Review | Midnimo Academy</title><style>body{margin:0;background:#f4f7fb;color:#071936;font:16px system-ui}header{background:#071936;color:white;padding:24px}a{color:#b68b1b}main{max-width:960px;margin:auto;padding:20px}.card{background:white;padding:20px;margin:15px 0;border:1px solid #dbe3ef;border-radius:14px}button{padding:10px;margin:4px;background:#e6bd57;border:0;border-radius:7px;cursor:pointer}select{padding:10px;max-width:100%}p{line-height:1.5}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script></head><body><header><h1>Midnimo Academy · Attendance Review</h1><a href="/admin-classes.html">← Class management</a></header><main><p id="status">Checking administrator access…</p><div id="private" hidden><label>Select class <select id="classSelect"></select></label><button id="load">Review students</button><div id="students"></div></div></main><script>
const db=supabase.createClient('https://uecogftwdvpfhxkdgjel.supabase.co','sb_publishable_zFAX-W1T8Hj5HMKwkA5Tcw_yaIjr-Ff');const el=id=>document.getElementById(id);const say=s=>el('status').textContent=s;const add=(parent,tag,text)=>{const n=document.createElement(tag);n.textContent=text;parent.append(n);return n};
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){say('Sign in using Student access first.');return}const a=await db.from('academy_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(!a.data){say('Administrator access required.');return}el('private').hidden=false;say('Choose a class to review.');const q=await db.from('class_events').select('id,title,course_slug,ends_at').order('starts_at',{ascending:false});if(q.error){say(q.error.message);return}window.events=q.data||[];for(const e of events){const o=add(el('classSelect'),'option',e.title);o.value=e.id}el('load').onclick=review}
async function review(){const e=events.find(x=>String(x.id)===el('classSelect').value);if(!e)return;const [r,a,b]=await Promise.all([db.from('class_reservations').select('user_id').eq('class_id',e.id),db.from('class_attendance').select('user_id,status').eq('class_id',e.id),db.from('class_absence_requests').select('user_id,reason,status').eq('class_id',e.id)]);if(r.error||a.error||b.error){say('Unable to load attendance records.');return}el('students').replaceChildren();for(const x of r.data){const att=a.data.find(v=>v.user_id===x.user_id),absence=b.data.find(v=>v.user_id===x.user_id);const card=add(el('students'),'div','');card.className='card';add(card,'p','Student ID: '+x.user_id);add(card,'p','Attendance: '+(att?.status||'Not checked in'));add(card,'p','Absence: '+(absence?.status||'None'));if(absence){add(card,'p','Reason: '+absence.reason);for(const state of ['approved','rejected']){const btn=add(card,'button',state==='approved'?'Approve absence':'Reject absence');btn.onclick=async()=>{const z=await db.from('class_absence_requests').update({status:state,reviewed_at:new Date().toISOString()}).eq('class_id',e.id).eq('user_id',x.user_id);if(z.error)alert(z.error.message);else review()}}}for(const state of ['present','excused','unexcused']){const btn=add(card,'button','Mark '+state);if(state==='unexcused'&&new Date(e.ends_at)>new Date())btn.disabled=true;btn.onclick=async()=>{const payload={class_id:e.id,user_id:x.user_id,status:state,reviewed_at:new Date().toISOString()};const z=att?await db.from('class_attendance').update(payload).eq('class_id',e.id).eq('user_id',x.user_id):await db.from('class_attendance').insert(payload);if(z.error)alert(z.error.message);else review()}}if(att?.status==='unexcused'){add(card,'p','Review emergency circumstances and any appeal before restricting access.');for(const state of ['suspended','dismissed','active']){const btn=add(card,'button',state==='active'?'Restore course access':state==='suspended'?'Suspend course access':'Dismiss from course');btn.onclick=async()=>{if(!confirm('Confirm '+state+' for this student?'))return;const z=await db.from('course_disciplinary_status').upsert({user_id:x.user_id,course_slug:e.course_slug,status:state,reason:'Attendance review for class '+e.id,updated_at:new Date().toISOString()},{onConflict:'user_id,course_slug'});if(z.error)alert(z.error.message);else say('Course access updated: '+state)}}}}if(!r.data.length)add(el('students'),'p','No reservations for this class.')}
init();</script></body></html>
